# Continuous integration for MegaPodcastPlayer.
#
# One job, because the build is small enough that the fan-out cost of separate jobs (each paying
# for its own checkout, JDK and Gradle cache restore) outweighs the parallelism. Split it when the
# wall-clock time stops being acceptable.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets a maintainer re-run CI without pushing an empty commit.
  workflow_dispatch:

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The Gradle daemon runs on 25 (see gradle/gradle-daemon-jvm.properties); Gradle
          # provisions that itself through the foojay resolver, so this is only the launcher JVM.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes the remote cache; PRs read it. Otherwise a PR could
          # poison the cache for everyone.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          validate-wrappers: true

      # Dependency verification (gradle/verification-metadata.xml) is enforced by every command
      # below: an artifact whose checksum is unknown fails the build rather than being used. When
      # that happens on a dependency bump, the fix is documented in docs/DEPENDENCY_VERIFICATION.md
      # — the verification report is published with the other reports at the end of this job.
      - name: Static analysis
        # First, because it is the fastest signal and needs no Android build.
        run: ./gradlew detekt --continue

      - name: Assemble
        run: ./gradlew assembleDebug

      - name: Release smoke build
        # Exercises R8, resource shrinking and the keep rules on every run, so that a shrinker
        # breakage is found here rather than on the phone. Signed with the debug key because CI
        # has no keystore by design (docs/RELEASE_SIGNING.md); the APKs are never uploaded, and a
        # debug-signed release APK must never be handed to anyone — see the `distribute` skill.
        run: ./gradlew :app:assembleRelease :wear:assembleRelease -PallowDebugSigningForRelease=true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest test --continue

      - name: Android Lint
        run: ./gradlew lintDebug --continue

      # Reporting only — no threshold, by design (T-3 in docs/REFACTORING_PLAN.md). The test
      # tasks it depends on are already up to date from the step above, so this costs only the
      # report generation. `koverLogUnit` puts the headline number in the job log, where a
      # reviewer can see the trend without downloading anything.
      - name: Coverage
        run: ./gradlew koverXmlReportUnit koverHtmlReportUnit koverLogUnit

      - name: Upload reports
        # Reports are the whole point of a failed run, so publish them either way.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
            build/reports/kover/**
            build/reports/dependency-verification/**
          retention-days: 14
          if-no-files-found: ignore
