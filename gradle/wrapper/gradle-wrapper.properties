distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# SHA-256 of the distribution above, as published at
# https://services.gradle.org/distributions/gradle-9.7.1-bin.zip.sha256 and confirmed against
# the downloaded bytes. Without it the wrapper installs whatever the URL serves; with it, a
# substituted distribution fails the build instead of running as the build system.
# Must be updated together with distributionUrl on every Gradle upgrade.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
