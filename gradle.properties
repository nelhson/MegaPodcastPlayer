# Project-wide Gradle settings for MegaPodcastPlayer.
# See https://docs.gradle.org/current/userguide/build_environment.html

# The Gradle daemon gets a generous heap: KSP (Room + Hilt) across ~15 modules is memory hungry.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX + per-library R classes (smaller R classes, faster incremental builds).
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
